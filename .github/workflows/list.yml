name: List Free Games

on:
  # Thursday 16:30 UTC = Friday 00:30 Asia/Shanghai (before claim)
  # Friday 16:30 UTC = Saturday 00:30 Asia/Shanghai (backup if Thursday runner was not acquired)
  schedule:
    - cron: '30 16 * * 4'
    - cron: '30 16 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - name: List free games
        run: node src/index.js --list --json
